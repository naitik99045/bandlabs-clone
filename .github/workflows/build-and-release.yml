name: Compile on GitHub & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated DAW and DSP test suite
        run: npm test

      - name: Set up Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Normalize line endings and permissions for gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Prepare Android Google Services configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "Copying google-services.json template for CI build"
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Build Next.js Web Studio (Static Export with Inlined Client Keys)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyAoefqMq0cHh1C7C3ShbWtg6eO-eXgEdTU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'bandlabs-clone.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'bandlabs-clone' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'bandlabs-clone.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '1080712064487' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:1080712064487:web:8304b2f291ca5064bba142' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vbggacgvdbgtgvtyupvo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_DT1f5WGCdJqjBmGsp8v3nA_TqY4gM9r' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Compile Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BandLab-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          name: BandLab Studio Pro ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          draft: false
          prerelease: false
          body: |
            ## 🎛️ BandLab Studio Pro v1.0.3 Mobile Release

            Reverse-engineered 1-to-1 BandLab mobile app UX flow, high-precision multi-track DAW, and native Android studio built with zero AI slop, strictly adhering to clean solid 60-30-10 OKLCH design principles.

            ### 🚀 New in v1.0.3:
            - **Multi-Screen UX Flow:**
              1. **Landing View:** High-converting discovery page with feature highlights, direct sign-in, and instant studio entry.
              2. **Authentication System:** Complete Sign In / Sign Up modal supporting Email & Password authentication, Google OAuth, and Instant Guest fallback with zero friction.
              3. **Mobile Creation Hub (Dashboard):** Authentic BandLab mobile dashboard with "+ Create New Project" hero card, Quick Launch tool triggers, My Projects library, starter templates (Trap, Pop, Drill), and fixed bottom navigation with the iconic centered red "+" button.
              4. **Creation Bottom Sheet:** Instant selection between Voice/Mic with AutoPitch pre-armed, 16-Step Beat Maker, Audio Import, and Multi-track Studio.
            - **Mobile-First Studio Ergonomics:**
              - **Dedicated Mobile Tracks View:** Large touch cards for volume fader, pan fader, REC arm, Mute, Solo, audio clip waveform summaries, and inline audio file import.
              - **Responsive View Switcher:** Header toggle between Tracks card view and Horizontal Multitrack Timeline.
              - **Navigation Back to Projects:** 1-tap `< Projects` return button to dashboard with inline project title renaming.
            - **Audio DSP & Modulations:**
              - Real-time AutoPitch vocal tuning suite with Doppler pitch shifter.
              - 16-Step Beat Maker drum machine with 8 synthesized voices.
              - Live microphone recording with VU level metering.
              - Client-side master mixdown export to 320kbps MP3 and 24-bit studio WAV.
            - **100% Automated Test Suite:** Verified across all unit and DSP suites.

            ### 📱 Download Android APK
            Download **`app-debug.apk`** below to install directly on your Android phone!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
