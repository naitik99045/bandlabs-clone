name: Compile on GitHub & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build Next.js Web Studio
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Compile Android APK on GitHub
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BandLab-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: BandLab Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🎛️ BandLab Studio v1.0.0 Release

            ### 🚀 Features Included:
            - **Web Studio & Android APK:** Multi-track DAW with track lanes, volume, pan, mute, and solo.
            - **Real-Time AutoPitch & Vocal Suite:** Granular pitch shifter (`PitchShifterNode`), LFO Chorus/Vibrato, Tube Saturation, 4-Band Parametric EQ, Compressor, Space Reverb, and Delay.
            - **Live Microphone Recording:** Real-time microphone input capture with live VU level meter and automatic clip placement on track lanes.
            - **16-Step Beat Maker:** 8 synthesized drum channels (808 Bass, Kick, Snare, Clap, Hats, Perc, Crash) with real-time pattern preview.
            - **1-Click Music Installation:** Client-side `OfflineAudioContext` instant export to 320kbps MP3 or 24-bit studio WAV directly onto your device ($0 server cost).
            - **Cloud User Settings & Firebase Auth:** Supabase `user_settings` sync and Firebase multi-provider auth with guest mode.

            ### 📱 Download Android APK
            Download **`app-debug.apk`** below to install directly on your Android phone!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
