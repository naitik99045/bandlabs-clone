name: Compile on GitHub & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated DAW and DSP test suite
        run: npm test

      - name: Set up Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Normalize line endings and permissions for gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Prepare Android Google Services configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "Copying google-services.json template for CI build"
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Build Next.js Web Studio (Static Export with Inlined Client Keys)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyAoefqMq0cHh1C7C3ShbWtg6eO-eXgEdTU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'bandlabs-clone.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'bandlabs-clone' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'bandlabs-clone.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '1080712064487' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:1080712064487:web:8304b2f291ca5064bba142' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vbggacgvdbgtgvtyupvo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_DT1f5WGCdJqjBmGsp8v3nA_TqY4gM9r' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Compile Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BandLab-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          name: BandLab Studio Pro ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          draft: false
          prerelease: false
          body: |
            ## 🎛️ BandLab Studio Pro v1.0.4 Native Android Mobile Experience

            100% Android-optimized touch UX, native mobile bottom transport dock, and card-driven studio controls built with zero AI slop, strictly adhering to clean solid 60-30-10 OKLCH design principles.

            ### 🚀 New in v1.0.4:
            - **Native Mobile Bottom Transport Dock:**
              - Relocated Play & Record to the bottom of the screen right under thumb reach.
              - Large circular Red Record button with live pulsing recording indicator.
              - Large circular Play/Pause button and Rewind-to-start action.
              - Dedicated Metronome button, 1-tap BPM indicator, and timecode readout (`00:00.0`).
              - 1-tap view switcher between Mobile Track Cards and Arrangement Timeline.
            - **Mobile Track Card Direct FX Triggers:**
              - Added direct **AutoPitch FX** shortcut button directly on Vocal track cards.
              - Added direct **16-Step 808 Sequencer** button directly on Drum track cards.
              - Touch-friendly faders with enhanced swipe target zones for Volume and Pan.
            - **Native Android App Bar & Clean Navigation:**
              - Streamlined mobile top app bar with `< Projects` return, tap-to-rename title, quick drawer icons, and 1-tap Mixdown export.
              - Hidden desktop status bar footer on mobile viewports for clean, unhindered screen real estate.
              - Android safe area inset padding and disabled tap delays (`touch-action: manipulation`).
            - **100% Automated Test Suite:** Verified across all unit and DSP suites.

            ### 📱 Download Android APK
            Download **`app-debug.apk`** below to install directly on your Android phone!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
